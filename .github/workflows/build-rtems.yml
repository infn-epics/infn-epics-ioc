name: Build RTEMS-pc686 IOC image (ghcr.io/infn-epics/infn-epics-ioc-rtems-pc686)

# Generic IOC for x86 VME boards (VMIVME-7750): the IOC is cross compiled for
# RTEMS-pc686 and the container runs rtems-proxy (see Dockerfile.rtems-pc686).
# Built on changes to the RTEMS build, published on rtems-v* tags.

on:
  push:
    branches:
      - '**'
    paths:
      - Dockerfile.rtems-pc686
      - ibek-support-infn
      - ibek-support-dls
      - ioc/**
      - .github/workflows/build-rtems.yml
    tags:
      - 'rtems-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/infn-epics-ioc-rtems-pc686
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rtems-pc686
          target: runtime
          build-args: TAGVERSION=${{ github.ref_name }}
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha,scope=rtems-pc686
          cache-to: type=gha,mode=max,scope=rtems-pc686
          load: true

      - name: Check the RTEMS IOC binary
        run: |
          docker run --rm --entrypoint bash ${{ env.IMAGE }}:test -c \
            'ls -la /epics/ioc/bin/RTEMS-pc686/ && test -f /epics/ioc/bin/RTEMS-pc686/ioc.boot'

      - name: Push developer and runtime images
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rtems-v') }}
        run: |
          docker buildx build --push -f Dockerfile.rtems-pc686 \
            --cache-from type=gha,scope=rtems-pc686 \
            --build-arg TAGVERSION=${{ github.ref_name }} --target developer \
            -t ${{ env.IMAGE }}-developer:${{ github.ref_name }} -t ${{ env.IMAGE }}-developer:latest .
          docker buildx build --push -f Dockerfile.rtems-pc686 \
            --cache-from type=gha,scope=rtems-pc686 \
            --build-arg TAGVERSION=${{ github.ref_name }} --target runtime \
            -t ${{ env.IMAGE }}:${{ github.ref_name }} -t ${{ env.IMAGE }}:latest .
